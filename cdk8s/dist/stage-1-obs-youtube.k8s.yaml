apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: obs-youtube
    app.kubernetes.io/instance: obs-youtube
    app.kubernetes.io/name: obs
    app.kubernetes.io/part-of: tripbot
  name: obs-youtube-config
  namespace: stage-1
data:
  DASHCAM_RTSP_URL: rtsp://mediamtx-youtube:8554/dashcam
  ONSCREENS_URL_BASE: http://onscreens-youtube:8080
  OBS_WEBSOCKET_PASSWD: adanalife
  OBS_QUALITY_PRESET: low
  OBS_STREAM_ENCODER: ffmpeg_vaapi_tex
  STREAM_PLATFORM: youtube
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: obs-youtube
    app.kubernetes.io/instance: obs-youtube
    app.kubernetes.io/name: obs
    app.kubernetes.io/part-of: tripbot
  name: obs-youtube
  namespace: stage-1
spec:
  replicas: 0
  selector:
    matchLabels:
      app: obs-youtube
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: obs-youtube
        app.kubernetes.io/name: obs
        app.kubernetes.io/instance: obs-youtube
        app.kubernetes.io/part-of: tripbot
      annotations:
        adanalife.dev/config-hash: e2f28d7f6d
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-onscreens
          image: ghcr.io/adanalife/obs:main
          imagePullPolicy: Always
          command:
            - sh
            - -c
          args:
            - for _ in $(seq 60); do curl -fsS -o /dev/null "http://onscreens-youtube:8080/health/ready" && exit 0; sleep 2; done; echo 'onscreens not ready, starting OBS anyway' >&2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: obs
          image: ghcr.io/adanalife/obs:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: vnc
              containerPort: 5900
            - name: websocket
              containerPort: 4455
            - name: novnc
              containerPort: 6080
            - name: obs-server
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: obs-youtube-config
            - secretRef:
                name: obs-youtube-stream-key
                optional: true
          livenessProbe:
            exec:
              command:
                - /opt/obs/healthcheck.sh
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              gpu.intel.com/i915: "1"
            limits:
              memory: 3Gi
              gpu.intel.com/i915: "1"
          volumeMounts:
            - name: music
              mountPath: /opt/tripbot/assets/music
              readOnly: true
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: obs-music-local
            readOnly: true
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: obs-youtube
    app.kubernetes.io/instance: obs-youtube
    app.kubernetes.io/name: obs
    app.kubernetes.io/part-of: tripbot
  name: obs-youtube-volume-gate
  namespace: stage-1
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: obs-youtube
        app.kubernetes.io/name: obs
        app.kubernetes.io/instance: obs-youtube
        app.kubernetes.io/part-of: tripbot
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: volume-gate
          image: ghcr.io/adanalife/mirror/ubuntu:24.04
          command:
            - "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: gated
              mountPath: /gated
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: gated
          persistentVolumeClaim:
            claimName: obs-music-local
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: obs-youtube
    app.kubernetes.io/instance: obs-youtube
    app.kubernetes.io/name: obs
    app.kubernetes.io/part-of: tripbot
  name: obs-youtube
  namespace: stage-1
spec:
  type: ClusterIP
  selector:
    app: obs-youtube
  ports:
    - name: vnc
      port: 5900
      targetPort: vnc
    - name: websocket
      port: 4455
      targetPort: websocket
    - name: novnc
      port: 6080
      targetPort: novnc
    - name: obs-server
      port: 8080
      targetPort: obs-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/issuer: letsencrypt-route53
    external-dns.alpha.kubernetes.io/hostname: obs-youtube.stage.whereisdana.today
  name: obs-youtube
  namespace: stage-1
spec:
  ingressClassName: traefik
  rules:
    - host: obs-youtube.stage.whereisdana.today
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: obs-youtube
                port:
                  name: novnc
  tls:
    - hosts:
        - obs-youtube.stage.whereisdana.today
      secretName: obs-youtube-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obs-youtube-ts
  namespace: stage-1
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: obs-youtube
      port:
        number: 6080
  tls:
    - hosts:
        - obs-youtube-stage
