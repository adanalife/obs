# This pyproject exists ONLY for the cdk8s/ deploy-authoring layer (the
# Kubernetes manifests that deploy the OBS image). The artifact this repo
# produces is a Docker image, not a Python package. Mirrors platform-gateway's
# and tripbot-console's plain-python cdk8s setup.
[project]
name = "obs-deploy"
version = "2.13.0"
description = "cdk8s deploy authoring for the adanalife OBS image (not the image itself)"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
# The k8s authoring layer (cdk8s/). Synth via `task cdk8s:synth`.
cdk8s = [
    "cdk8s>=2.70.86",
    "constructs>=10.7.1",
    "pyyaml>=6.0.3",
]
# Tests over the synthed manifests. pytest to match infra's cdk8s suite, which
# is the fleet's existing shape for exactly this kind of assertion; the YAML
# reader comes from the cdk8s group above, so `task test` runs with both.
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["cdk8s/tests"]
pythonpath = ["cdk8s"]
