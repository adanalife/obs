# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Three settings are repeated on every entry below, since Dependabot has no
  # place to state a default once:
  #
  #   cooldown        holds a new release for 7 days before it becomes a PR, so
  #                   a release that gets yanked or immediately patched never
  #                   costs a review. A major waits 14 -- but only where the
  #                   ecosystem has a SemVer model: Dependabot rejects the
  #                   semver-* keys for github-actions and docker, so those
  #                   carry the flat 7. The asymmetry is required, not an
  #                   oversight.
  #                   Dependabot already applies 3 days by default; this widens
  #                   it. Security updates ignore cooldown entirely, so nothing
  #                   urgent waits.
  #   rebase-strategy is disabled. The default rebases every open bump PR
  #                   whenever main moves and re-runs all of their checks, which
  #                   costs far more CI than it saves; no ruleset here needs
  #                   a branch to be up to date before merging.
  #   schedule        is weekly on Monday 13:00 UTC, so a week's bumps arrive as
  #                   one batch to review rather than trickling in daily.
  #                   The uv entry runs quarterly -- see its own note below.
  #
  # Bumps carry no user-facing change, so they never need a towncrier
  # changelog fragment. Self-apply skip-changelog so the changelog
  # workflow's existing label escape hatch exempts them — this keeps the
  # enforcement workflow bot-agnostic (survives a future move off Dependabot
  # without a workflow edit). Note: setting `labels` replaces Dependabot's
  # defaults, so the otherwise-automatic dependencies/ecosystem labels are
  # restated here.
  #
  # Every ecosystem batches into one PR per scheduled run, majors included,
  # and a second group per ecosystem catches security updates, which
  # Dependabot otherwise opens one PR per advisory on whatever day it lands.
  # Each solo PR costs a full CI run and touches the same lockfile as its
  # siblings, so the first merge leaves the rest conflicting -- and
  # rebase-strategy is disabled, so nothing repairs them. A red group is
  # bisected by hand; that is cheaper than the queue of single-bump PRs it
  # replaces.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - github_actions
      - skip-changelog
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    groups:
      docker:
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - docker
      - skip-changelog
    cooldown:
      default-days: 7
    rebase-strategy: disabled
  # The cdk8s authoring layer's Python dependencies, declared in
  # pyproject.toml's dependency-groups and locked in uv.lock. Without this
  # entry they take no updates at all, security included.
  #
  # This repo's uv project is the cdk8s authoring layer, so it runs quarterly
  # rather than weekly: jsii auto-releases cdk8s on nearly every upstream
  # change -- dozens of patches a quarter, all inside one minor -- so a weekly
  # run always finds a newly-eligible patch and turns that stream into a weekly
  # PR whatever the cooldown is. Quarterly collapses it to one PR carrying the
  # same end state; security updates run on their own cadence regardless.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: quarterly
      day: monday
      time: "13:00"
    groups:
      python:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - python
      - skip-changelog
    cooldown:
      default-days: 7
      semver-major-days: 14
    rebase-strategy: disabled
