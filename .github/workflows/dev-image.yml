# Floating :main image on every main push — what stage-1 deploys
# (imagePullPolicy: Always picks up rebuilds under the tag). amd64-only: prod and
# stage both run OBS on the amd64 minipc, so the arm64 image is only built at
# tagged releases (release.yml), not on every main push.
# A failed build alerts Discord through the shared workflow's alert job, so
# :main freezing on the previous commit does not go unnoticed.
name: dev-image
on:
  push:
    branches:
      - main

# Only build the newest main merge. Cancel an in-flight build when a newer
# main push arrives — :main should track HEAD.
concurrency:
  group: dev-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: adanalife/infra/.github/workflows/image.yml@main
    with:
      image: obs
      build-args: |
        VERSION=main-${{ github.sha }}
        SHA=${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
