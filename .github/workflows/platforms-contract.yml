name: platforms-contract

# Keeps the generated contracts this repo syncs copies of in step with their
# owners, through infra's shared contract-sync workflow: platforms.json (the
# fleet-wide platform set, owned by platform-gateway's Go adapter registry) and
# contract.json (canonical service names, ports and env-var keys, owned by
# tripbot's pkg/contract). A drifted copy becomes a PR on `bot/contract-sync`.
#
# The triggers are the point of this workflow: upstream drift lands with no PR
# here to notice it. The owners send `contract-changed` when a push to their
# main touches a contract, and the daily schedule catches a missed dispatch.
# The PR-time checks are steps of the `gates` job in pr-gates.yml.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [contract-changed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platforms-contract:
    uses: adanalife/infra/.github/workflows/contract-sync.yml@main
    with:
      runs-on: ubuntu-latest
      platforms: true
      tripbot: contract.json
    secrets: inherit
