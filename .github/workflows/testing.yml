# PR + branch smoke test: build the amd64 image and prove it boots to a healthy
# state with no STREAM_KEY. Standalone (no docker-compose) — the OBS container
# doesn't need a dashcam relay to start or pass its healthcheck: it only checks
# the OBS process, the Wayland session, and the absence of the safe-mode crash
# modal. Browser/RTSP sources retry on missing peers without crashing OBS.
#
# arm64 isn't built here — its from-source compile is slow and only changes when
# the OBS/CEF version bumps; release.yml covers the arm64 build at tag time, and
# obs-base.yml rebuilds the CEF base when it changes.
name: testing
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Invariants over the committed cdk8s/dist/. Seconds, no image build: the
  # cdk8s-synth workflow proves dist matches the code, and this proves neither has
  # broken a rule that a plausible-looking golden diff would otherwise carry
  # through — nothing but noVNC on an Ingress, every OBS born parked.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: astral-sh/setup-uv@v9.0.0 # no floating major tag published
      - name: Check manifest invariants
        run: uv run --group cdk8s --group dev pytest -q

  # Bed selection is pure bash + jq against the committed scene template, so it
  # runs in seconds without waiting on the image build below.
  background-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check background-audio bed selection
        run: scripts/check-background-audio.sh

  # The container's boot sequence is pure env -> config rendering right up to
  # the supervisord handoff, so it runs against the repo's own templates with
  # supervisord stubbed. Catches the class of fault a pod restart would
  # otherwise discover on air: a canvas the wrong way round, a stream pointed
  # at the wrong ingest, an encoder profile OBS drops back to software.
  entrypoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check entrypoint config rendering
        run: scripts/check-entrypoint.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build OBS image (amd64, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: obs:ci
          load: true
          cache-from: type=gha,scope=obs-amd64
          cache-to: type=gha,mode=max,scope=obs-amd64

      - name: Run OBS (no STREAM_KEY)
        run: docker run -d --name obs-ci obs:ci

      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' obs-ci)
            echo "OBS health: $state ($i/30)"
            [ "$state" = "healthy" ] && exit 0
            sleep 2
          done
          echo "OBS failed to become healthy" >&2
          exit 1

      - name: Verify version files baked into image
        run: |
          docker exec obs-ci test -s /etc/tripbot/version
          docker exec obs-ci test -s /etc/tripbot/sha

      - name: Container logs
        if: always()
        run: docker logs obs-ci

      - name: Tear down
        if: always()
        continue-on-error: true
        run: docker rm -f obs-ci
