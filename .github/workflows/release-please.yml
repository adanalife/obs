name: release-please
# Trunk-based release flow, run by infra's shared release-please workflow: a
# standing release PR on main (the next version + prod pin), with the towncrier
# changelog built onto its branch and cdk8s/dist re-synthed to match the prod
# pin release-please bumped. Merging the release PR creates the vX.Y.Z tag +
# GitHub Release, and the tag fires release.yml on its own.
#
# workflow_dispatch is the escape hatch for a stale release branch:
# release-please only rebuilds the PR when a *releasable* commit lands, so a
# run of chore-only merges leaves the branch on an old base. Dispatching
# rebases it off current main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    uses: adanalife/infra/.github/workflows/release-please.yml@main
    with:
      runs-on: ubuntu-latest
      # Re-synth so the committed dist matches the prod pin release-please bumped.
      stage: uv run --group cdk8s python cdk8s/main.py
    secrets: inherit
