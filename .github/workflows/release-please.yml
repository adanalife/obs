name: release-please
# Trunk-based release flow: release-please maintains a standing release PR on
# main — the next version + prod pin, computed from the conventional commits
# since the last release. `skip-changelog` is set because this repo keeps
# towncrier: the "Build changelog + re-synth" step below collates the
# changelog.d/ fragments into CHANGELOG.md (and re-synths cdk8s/dist to match
# the prod pin release-please just bumped) on the release PR branch, so the
# built changelog + synced dist land atomically with the version bump when the
# PR squash-merges.
#
# Merging the release PR creates the vX.Y.Z tag + GitHub Release; release.yml is
# then dispatched explicitly at that tag because GITHUB_TOKEN-created tags don't
# fire push triggers.
#
# The manual trigger is the escape hatch for a stale release branch: release-please
# only rebuilds the PR when a *releasable* commit lands, so a run of chore-only
# merges leaves the branch on an old base — and any repo-state check that runs on
# the release PR (the contract-sync gate) keeps failing against content main has
# already fixed. Dispatching rebases it off current main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # tag + GitHub Release + release-PR branch
  pull-requests: write # open/update the release PR
  actions: write # dispatch release.yml

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # On the standing-release-PR run (not the release-created run), stage the
      # towncrier changelog + re-synthed dist onto the PR branch. Pushed with the
      # automation app token so the push fires the PR's pull_request events (CI
      # gates re-run against the final release state); a GITHUB_TOKEN push
      # wouldn't. release-please recreates this branch from main on every push,
      # so this rebuild is idempotent.
      - name: Mint automation app token
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Check out the release PR branch
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          ref: release-please--branches--main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@v4
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}

      - uses: astral-sh/setup-uv@v10.0.1 # no floating major tag published
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}

      - name: Build changelog + re-synth cdk8s on the release PR branch
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        run: |
          set -euo pipefail
          # release-please bumped pyproject.toml on this branch — the version is
          # the single source of truth for both the changelog and the cut tag.
          VERSION=$(grep -m1 -oE '^version = "[^"]+"' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Release version: $VERSION"

          CHANGED=0

          # A fragment still named "+<slug>.<type>.md" here missed its PR-time
          # rename: changelog-number.yml checks out the head branch, and a merge
          # that lands while that job is queued deletes the branch out from under
          # it. The squash commit that put the fragment on main carries the PR
          # number in its subject, so recover it from there — this is the last
          # moment before towncrier turns fragments into permanent changelog
          # lines, and it needs no branch to still exist.
          for f in changelog.d/+*.md; do
            [ -e "$f" ] || continue
            subject="$(git log --diff-filter=A --format=%s -1 -- "$f")"
            pr="$(printf '%s' "$subject" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')"
            if [ -z "$pr" ]; then
              echo "::warning title=Unnumbered changelog fragment::${f} has no PR number in the commit that added it (\"${subject}\") — its entry will publish without a link."
              continue
            fi
            base="$(basename "$f" .md)"
            type="${base##*.}"
            # `towncrier create` de-duplicates its own output by appending a counter
            # before .md, so a second +ci.ci.md arrives as +ci.ci.1.md and the last
            # segment is that counter rather than the type. Read as the type, it
            # yields <PR>.1.md, a name with no type that towncrier rejects.
            case "$type" in
              *[!0-9]*) ;;                        # a real type, not a counter
              *) stem="${base%.*}"; type="${stem##*.}" ;;
            esac
            target="changelog.d/${pr}.${type}.md"
            n=0
            while [ -e "$target" ]; do
              n=$((n + 1))
              target="changelog.d/${pr}.${type}.${n}.md"
            done
            echo "::notice title=Recovered changelog fragment::${f} -> ${target} (from #${pr})."
            git mv "$f" "$target"
          done

          # Collate the towncrier fragments (if any) into CHANGELOG.md + delete
          # them. A release PR can exist with no fragments (a fix: whose entry was
          # skip-changelog'd) — that's not an error, just no changelog stanza.
          if compgen -G "changelog.d/*.md" > /dev/null; then
            uvx towncrier build --yes --config towncrier.toml --version "$VERSION"
            CHANGED=1
          fi

          # release-please bumped the prod pin in cdk8s/versions.yaml; re-synth so
          # the committed dist matches (cdk8s-synth.yml gates on this).
          uv run --group cdk8s python cdk8s/main.py
          git diff --quiet || CHANGED=1

          if [ "$CHANGED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: build changelog + re-synth dist for $VERSION"
            git push origin HEAD:release-please--branches--main
          fi

      - name: Dispatch release workflow at the new tag
        if: ${{ steps.release.outputs.release_created }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
